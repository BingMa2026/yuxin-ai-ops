# 同一份路由同时服务正式域名及迁移期旧 IP。
location = /web { return 308 /web/; }
location /web/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /web/index.html;
    add_header Cache-Control "no-cache" always;
}

location = /api/v1 { return 308 /api/v1/; }
# FastAPI 静态资源挂载要求保留 /api/v1；普通 API 去掉该前缀。
location ^~ /api/v1/static/ {
    proxy_pass $ops_backend;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-Prefix /api/v1;
}
location /api/v1/ {
    rewrite ^/api/v1/(.*)$ /$1 break;
    proxy_pass $ops_backend;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header X-Forwarded-Prefix /api/v1;
}
