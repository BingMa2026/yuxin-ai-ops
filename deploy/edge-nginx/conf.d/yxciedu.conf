# 唯一公网域名及路由入口。不在官网镜像中重复配置 API 代理。
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server_tokens off;
resolver 127.0.0.11 ipv6=off valid=30s;

# 保留旧 IP API，供尚未升级的客户端迁移；未知 Host 不提供业务。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name 119.45.121.36;
    set $ops_backend http://yuxin-ai-ops-backend:8001;
    client_max_body_size 50m;
    include /etc/nginx/snippets/operations.conf;
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name www.yxciedu.com yxciedu.com;
    return 308 https://www.yxciedu.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yxciedu.com yxciedu.com;

    ssl_certificate /etc/nginx/ssl/yxciedu/www.yxciedu.com_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/yxciedu/www.yxciedu.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:yxciedu_tls:10m;
    ssl_session_timeout 1d;
    # 证书包含根域；如补充根域 DNS，也统一跳到 www。
    if ($host = yxciedu.com) { return 308 https://www.yxciedu.com$request_uri; }

    client_max_body_size 50m;
    set $ops_backend http://yuxin-ai-ops-backend:8001;
    set $website_api http://bid-website-api:3001;
    set $website_web http://bid-web:80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    include /etc/nginx/snippets/operations.conf;

    location = /product-api { return 308 /product-api/; }
    location /product-api/ {
        rewrite ^/product-api/(.*)$ /api/v1/$1 break;
        proxy_pass $ops_backend;
        include /etc/nginx/snippets/proxy.conf;
        # 产品令牌与官网 Cookie 各自独立，沿用原代理行为。
        proxy_set_header Cookie "";
        add_header Cache-Control "no-store" always;
    }
    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass $website_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    location = /payout/wechat {
        proxy_pass $website_web;
        include /etc/nginx/snippets/proxy.conf;
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy no-referrer always;
    }
    location / {
        proxy_pass $website_web;
        include /etc/nginx/snippets/proxy.conf;
    }
}
